# Crimson Moon — character cards for Arabic localization
# Source: research/dialogue_all.txt. gender: m / f / unknown. No guesses: no EN/FR evidence = unknown.
# addressee_gender_default: m for every player-directed speaker (FR tally 28 masc vs 4 fem; see 04b_corpus_speaker_notes.md).
# NOTE: namespaces are voice banks, not strict speakers. NPC_Solomon and NPC_Angel_Male each contain lines
# spoken by the other party in the exchange. Assign speaker per line where the bank is Solomon/Angel.

NPC_Angel_Male:
  name: UNCONFIRMED   # Gallant's "Nahnias fights beside you now" may name the Angel; not tied explicitly
  gender: m
  gender_evidence: '"namespace NPC_Angel_Male only; text has no self-pronoun. FR neutral: ''Je suis à tes côtés, pour toujours''"'
  role: the player's bound guardian Angel; shares the body after the Soul Siphon; narrates exploration, quest hints, combat callouts, lore commentary
  addresses: player (Nephilim); occasionally Solomon / Valahk-Nor
  addressee_gender_default: m
  voice: formal, earnest, reflective; rhetorical questions about faith and institutions; frequent shared "we/us"
  register: elevated
  dialect_notes: standard formal English; FR uses vous in tutorial/mission lines and tu in field lines
  preserve:
    - 'first-person-plural "we/our" for the shared body'
    - 'rhetorical questions'
    - 'mission-briefing tone'
    - 'exclamatory combat callouts'
  avoid:
    - 'slang'
    - 'contractions-heavy chatter'
    - 'comic tone'
    - 'addressing the player as feminine'

NPC_Blacksmith:
  name: Gajov   # surname "Resnyk" NOT in corpus - UNCONFIRMED
  gender: m
  gender_evidence: '"EN: ''Bring Gajov what he need''; Librarian ''see the Blacksmith. He''s one himself''; Monk ''the wolf-boy''. FR: ''Gajov est prêt''"'
  role: the Order's blacksmith; Karsivite vampire conscripted by Gallant; worships Vodor / "Pack in the sky"
  addresses: player (pup / stray pup / good pup / nephilim / friend); Gallant; Lady Mereda; Vodor
  addressee_gender_default: m
  voice: broken speech, third-person self-reference, imperative fragments, dog metaphors (pup/fetch/toy); growls and grunts in stage directions
  register: comic
  dialect_notes: drops articles and copulas ("Forge hot", "Sword dull"), "no" for "don't" ("No touch sword!"), occasional full sentences in lore lines
  preserve:
    - 'third-person self-reference "Gajov"'
    - 'telegraphic fragments'
    - '"pup" and fetch/toy metaphors'
    - '"Kill gods" bluntness'
    - 'growl/grunt stage directions'
  avoid:
    - 'fluent grammatical prose'
    - 'politeness formulas'
    - 'elevated vocabulary'
    - 'articles where EN dropped them'

NPC_Librarian:
  name: Mereda   # cross-referenced (Gallant "Mereda, the Order's archivist"; Monk "what she has you reading"); never self-named; surname unknown
  gender: f
  gender_evidence: '"EN: Monk ''what she reads by it''; Merchant ''lass has been waitin'''', ''She''s in on it''; Gallant ''when her and I had just met''. FR: ''Contente de te revoir, chevalier'', ''Je suis vraiment désolée''"'
  role: the Order's archivist and scholar; immortal (over 100 years); conscripted by the Faith; deciphers texts, forges requisitions with Lotte
  addresses: player (knight / child / Nephilim / dear / brute / dog)
  addressee_gender_default: m
  voice: dry, condescending scholar; sarcastic; long exposition monologues; irritable when interrupted; warms up over time
  register: archaic
  dialect_notes: '"''Tis", "''fore all is lost", "what bringith", "I sent ye", "Good show"; bookish British sarcasm'
  preserve:
    - 'archaic-literary flavor'
    - 'condescending endearments (child / dear) alongside insults (brute / dog)'
    - 'sarcastic asides'
    - 'lore-lecture cadence'
  avoid:
    - 'street slang'
    - 'warmth without bite'
    - 'simplifying the exposition'
    - 'feminine forms for the player'

NPC_Merchant:
  name: Lotte Ananta   # FR self-names: "Car moi, Lotte Ananta, je suis là..."
  gender: m
  gender_evidence: '"EN: Angel ''Lotte''s been busy... lets check in with him''; Monk ''Lotte cannot leave his chair''; Merchant ''you''re talking to the man who did''; ''{counting coin under his breath}''. FR: ''je me suis retrouvé'', ''un chat de gouttière''"'
  role: potion/trinket vendor; former master thief cursed into an immobile bloated body by a Cathedral artifact; technically dead; questline about his crew and lost love Aleria Hawthorn
  addresses: player (friend / mate / chap / sir / sonny / stray / 'alf breed); Gajov ("mate")
  addressee_gender_default: m
  voice: cockney salesman patter, self-deprecating fat jokes, sudden sincerity; constant "friend"
  register: comic
  dialect_notes: dropped g's ("lookin'"), dropped h's ("'ere", "'alf"), "innit", "cor", "ya/yer", "skint", "git", "wanker", "sod", "Toffs"; third-person "ol' Lotte"
  preserve:
    - 'colloquial register'
    - '"friend"/"mate" tags'
    - '"ol'' Lotte" third-person self-mention'
    - 'salesman one-liners'
    - 'mild profanity'
    - 'emotional turns in the crew/Aleria arc'
  avoid:
    - 'formal or literary Arabic'
    - 'removing the humor'
    - 'softening "wanker/bastard" to nothing'
    - 'feminine address'

NPC_Hub_Monk_1:
  name: UNCONFIRMED   # never named
  gender: m
  gender_evidence: '"FR: ''Je ne devrais pas me sentir soulagé quand ils échouent.'' EN implicit: monk among ''the brothers''"'
  role: Lunitarian monk in the Order's hub; keeper of registers and candles; ex-novice under Gallant; nervous observer and gossip
  addresses: player (Nephilim); frequently speaks ABOUT the player in third person ("the Knight", "the Nephilim")
  addressee_gender_default: m
  voice: aphorisms, liturgical repetition, flat declaratives, understatement, refrains "I am told", "The brothers do not speak of this"
  register: elevated
  dialect_notes: formal, no contractions, deadpan-unsettling; parallel sentence triplets
  preserve:
    - 'aphoristic structure'
    - 'verbatim repetition refrains'
    - 'third-person references to the player as "the Knight"'
    - 'liturgical parallelism'
    - 'dry understatement'
  avoid:
    - 'slang'
    - 'warmth'
    - 'emotional exclamations'
    - 'breaking the deadpan'
    - 'merging repeated sentences into one'

NPC_Gallant:
  name: Gallant Alexander
  gender: m
  gender_evidence: '"EN: Monk ''Older than he looks''; Solomon ''He who helped enslave''; Gallant ''proud to call you my brother''. FR: ''j''ai été tué par une vampire amoureuse'', ''Je serai prêt''"'
  role: Knight Commander of the Order of the Crimson Moon; the first Nephilim (~300 years); led the Apostate Hunts; slayer of Valahk-Nor
  addresses: player (Nephilim / Paladin / Knight / my brother); Mereda
  addressee_gender_default: m
  voice: military terse; short imperatives; maxims; occasional weary gallows humor; contract-board one-liners
  register: plain
  dialect_notes: standard English, clipped; "ya" once
  preserve:
    - 'terseness'
    - 'two-beat maxims ("Be ruthless, not reckless.")'
    - 'commander-to-soldier tone'
    - '"brother" kinship'
    - 'encouragement without sentimentality'
  avoid:
    - 'padding short lines'
    - 'flowery diction'
    - 'softening commands into requests'
    - 'feminine address'

NPC_Solomon:
  name: Solomon Moore
  gender: m
  gender_evidence: '"EN: Angel ''Solomon may have a point, but he isn''t right''; Solomon ''my dearest Deliliah... my son''; Female_2 ''the man who promised to rebuild Gildenarch''"'
  role: antagonist; ex-clergyman turned industrialist; architect of the Godsreach Spire; servant of Cain; voice from the Spire tempting the player
  addresses: player (Nephilim / dear Nephilim / dog / hound / slave); the Angel; Felwyl
  addressee_gender_default: m
  voice: polished rhetoric, philosophical monologue, sneering condescension, rhetorical "Hmm?"
  register: menacing
  dialect_notes: standard, articulate, long sentences; bank also contains Angel/Nephilim reply lines - assign per line
  preserve:
    - 'persuasive-cynical rhetoric'
    - 'long periodic sentences'
    - 'contemptuous pet names (dog / hound / slave)'
    - 'philosophical aphorisms'
  avoid:
    - 'slang'
    - 'shouting where EN is calm'
    - 'cutting the argument structure'
    - 'feminine address'

